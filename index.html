<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="js-widget-title" content="File Downloader">
	<title>File Downloader</title>
	<style>
		:root {
			--round: 12px;
			--lighter: rgb(82, 82, 82);
			--light: rgb(53, 53, 53);
		}
		
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;

			color: white;
			font-size: 20px;
		}
		
		body {
			display: block;
			margin: 2vh;

			width: 100%;
			height: 100vh;

			justify-items: center;
			
			background-color: rgb(43, 43, 43);
		}

		h1 {
			font-size: 30px;
		}

		input[type = text] {
			width: 30vh;
			height: 8vh;

			padding-left: 2vh;
			
			background-color: var(--light);
			border-radius: var(--round);
		}

		.ignore-background {
			display: contents;
			justify-items: left;
			text-align: left;

			width: 100%;
			height: 100%;
		}

		.body-wrapper {
			display: flex;
			flex-direction: column;
			align-content: center;
			justify-content: center;
		}

		.download-input-wrapper {
			display: flex;
			flex-direction: column;

			margin: 20px;
		}

		.download-input-wrapper > * ~ * {
			margin-top: 3vh;
		}

		.a-button {
			display: block;
			text-align: center;
			align-content: center;

			width: 30vh;
			height: 10vh;

			background-color: var(--lighter);
			border-radius: var(--round);
			text-decoration: none;
		}
	</style>
</head>
<body>
	<script type="text/javascript">
		function pushLog(msg) {
			return window.__wweb2Log ? window.__wweb2Log(msg) : console.log(msg)
		}
		
		function  __wweb2WaitMillisecondsToWidgetIsReady(currentDelayMs) {
			return  0;
		}

		async function downloadFile() {
			/** @type {Response} */
			let res
			try {
				/** @type {HTMLInputElement} */
				const el = document.getElementById("url-input")
				res = await fetch(el.value)
			} catch (err) { pushLog("Failed to fetch."); return; }
			pushLog(res)
		}
		
		let query = window.location.hash
		if (query.startsWith('#')) {
			query = query.substring(1)
		}
		const params = new URLSearchParams(query)
		const action = params.get("action")
		if (action) {
			switch (action) {
				case "download": {
					downloadFile()
					break
				}
				default: {
					pushLog("ignored")
					break
				}
			}

			params.delete("action")
		}
	</script>
	<button class="ignore-background">
		<div class="body-wrapper">
			<h1>Download file with URL</h1>
			<div class="download-input-wrapper">
				<input class="url-input" id="url-input" type="text">
				<a class="a-button" href="#action=download" onclick="event.preventDefault(); downloadFile()">Download</a>
			</div>
		</div>
	</button>
</body>
</html>
